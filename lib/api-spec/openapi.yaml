openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/timetable/context:
    get:
      operationId: getAdminTimetableContext
      tags: [admin-timetable]
      summary: Get school metadata required by the Timetable Master
      responses:
        "200":
          description: Timetable setup values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTimetableContext"
        "403":
          description: Admin access or the Support Staff Timetable Master grant is required
  /admin/calendar/context:
    get:
      operationId: getAdminCalendarContext
      tags: [admin-calendar]
      summary: Get school metadata required by the School Calendar
      responses:
        "200":
          description: Calendar targeting values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCalendarContext"
        "403":
          description: Admin access or the Support Staff School Calendar grant is required
  /admin/attendance/context:
    get:
      operationId: getAdminAttendanceContext
      tags: [admin-attendance]
      summary: Get school and attendance policy values required by Attendance Overview
      responses:
        "200":
          description: Attendance setup values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAttendanceContext"
        "403":
          description: Admin access or the Support Staff Attendance Overview grant is required
  /admin/exam-controller/context:
    get:
      operationId: getAdminExamControllerContext
      tags: [admin-exam-controller]
      summary: Get school metadata required by the Exam Controller
      responses:
        "200":
          description: Exam Controller setup values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExamControllerContext"
        "403":
          description: Admin access or the Support Staff Exam Controller grant is required
  /admin/noticeboard/context:
    get:
      operationId: getAdminNoticeboardContext
      tags: [admin-noticeboard]
      summary: Get school metadata required by the Noticeboard
      responses:
        "200":
          description: Noticeboard targeting values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNoticeboardContext"
        "403":
          description: Admin access or the Support Staff Noticeboard grant is required
  /mobile/auth/teacher/change-password:
    post:
      operationId: mobileTeacherFirstLoginChangePassword
      tags: [mobile-auth]
      summary: Complete a teacher's required first-login password change
      description: Uses a short-lived single-purpose challenge and returns no authenticated session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTeacherFirstLoginPasswordChange"
      responses:
        "200":
          description: Password changed; the teacher must sign in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTeacherFirstLoginPasswordChanged"
        "400":
          description: Invalid request or password confirmation.
        "401":
          description: Challenge expired or invalid.
        "429":
          description: Too many attempts.
        "503":
          description: Password change temporarily unavailable.
  /student/module-dot-state:
    get:
      operationId: getStudentModuleDotState
      tags: [student-notifications]
      summary: Get the authenticated Student's module-dot state for the selected session
      description: Requires an authenticated Student Web session. The session header is validated against the Student's school.
      parameters:
        - in: header
          name: x-view-session-id
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: Activity state and latest visible cursors for the four supported Student modules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModuleDotStateResponse"
        "400":
          description: A selected Academic Session is required or invalid
        "401":
          description: Student Web authentication is required
        "403":
          description: The selected session is not available to this Student
  /student/module-dot-state/seen:
    post:
      operationId: markStudentModuleSeen
      tags: [student-notifications]
      summary: Persist the authenticated Student's observed activity cursor for one module
      description: Requires an authenticated Student Web session. The Student and school are derived server-side; only visible activity in the selected session can be marked.
      parameters:
        - in: header
          name: x-view-session-id
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentModuleSeenInput"
      responses:
        "200":
          description: The observed cursor was persisted, or was already superseded by a newer cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentModuleSeenResponse"
        "400":
          description: The module or activity cursor is invalid
        "401":
          description: Student Web authentication is required
        "403":
          description: The activity cursor is not visible to this Student in the selected session
  /teacher/module-dot-state:
    get:
      operationId: getTeacherModuleDotState
      tags: [teacher-notifications]
      summary: Get the authenticated Teacher's module-dot state for the selected session
      description: Requires an authenticated Teacher Web session. Teacher, school, and session ownership are validated server-side.
      parameters:
        - in: header
          name: x-view-session-id
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: New-activity state and latest visible cursors for the four supported Teacher modules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherModuleDotStateResponse"
        "400":
          description: A selected Academic Session is required or invalid
        "401":
          description: Teacher Web authentication is required
        "403":
          description: The selected session is not available to this Teacher
  /teacher/module-dot-state/seen:
    post:
      operationId: markTeacherModuleSeen
      tags: [teacher-notifications]
      summary: Persist the authenticated Teacher's observed cursor for one module
      description: Accepts only a cursor the Teacher can see in the selected session. Teacher and school are derived server-side.
      parameters:
        - in: header
          name: x-view-session-id
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherModuleSeenInput"
      responses:
        "200":
          description: The cursor was persisted monotonically, or a newer cursor was already saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherModuleSeenResponse"
        "400":
          description: The module or activity cursor is invalid
        "401":
          description: Teacher Web authentication is required
        "403":
          description: The activity cursor is not visible to this Teacher in the selected session
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentModuleKey:
      type: string
      enum: [homework, classwork, noticeboard, complaints]
    StudentModuleActivityCursor:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          type: string
          description: Raw timestamp-without-time-zone text from the source event; used only as an ordering cursor.
          maxLength: 26
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?$"
        recordId:
          type: integer
          minimum: 1
      required: [createdAt, recordId]
    StudentModuleDotState:
      type: object
      additionalProperties: false
      properties:
        hasNewActivity:
          type: boolean
        latestActivityCursor:
          oneOf:
            - $ref: "#/components/schemas/StudentModuleActivityCursor"
            - type: "null"
      required: [hasNewActivity, latestActivityCursor]
    StudentModuleDotStateResponse:
      type: object
      additionalProperties: false
      properties:
        homework:
          $ref: "#/components/schemas/StudentModuleDotState"
        classwork:
          $ref: "#/components/schemas/StudentModuleDotState"
        noticeboard:
          $ref: "#/components/schemas/StudentModuleDotState"
        complaints:
          $ref: "#/components/schemas/StudentModuleDotState"
      required: [homework, classwork, noticeboard, complaints]
    StudentModuleSeenInput:
      type: object
      additionalProperties: false
      properties:
        module:
          $ref: "#/components/schemas/StudentModuleKey"
        cursor:
          $ref: "#/components/schemas/StudentModuleActivityCursor"
      required: [module, cursor]
    StudentModuleSeenResponse:
      type: object
      additionalProperties: false
      properties:
        module:
          $ref: "#/components/schemas/StudentModuleKey"
        markedSeen:
          type: boolean
      required: [module, markedSeen]
    TeacherModuleKey:
      type: string
      enum: [noticeboard, complaints, leave, approval_center]
    TeacherModuleActivityCursor:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          type: string
          description: Raw source timestamp text used only for deterministic activity ordering.
          maxLength: 26
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?$"
        source:
          type: string
          enum: [notice, peer_report, student_leave, student_profile_submission, student_profile_photo]
        recordId:
          type: integer
          minimum: 1
      required: [createdAt, source, recordId]
    TeacherModuleDotState:
      type: object
      additionalProperties: false
      properties:
        hasNewActivity:
          type: boolean
        latestActivityCursor:
          oneOf:
            - $ref: "#/components/schemas/TeacherModuleActivityCursor"
            - type: "null"
      required: [hasNewActivity, latestActivityCursor]
    TeacherModuleDotStateResponse:
      type: object
      additionalProperties: false
      properties:
        noticeboard:
          $ref: "#/components/schemas/TeacherModuleDotState"
        complaints:
          $ref: "#/components/schemas/TeacherModuleDotState"
        leave:
          $ref: "#/components/schemas/TeacherModuleDotState"
        approval_center:
          $ref: "#/components/schemas/TeacherModuleDotState"
      required: [noticeboard, complaints, leave, approval_center]
    TeacherModuleSeenInput:
      type: object
      additionalProperties: false
      properties:
        module:
          $ref: "#/components/schemas/TeacherModuleKey"
        cursor:
          $ref: "#/components/schemas/TeacherModuleActivityCursor"
      required: [module, cursor]
    TeacherModuleSeenResponse:
      type: object
      additionalProperties: false
      properties:
        module:
          $ref: "#/components/schemas/TeacherModuleKey"
        markedSeen:
          type: boolean
      required: [module, markedSeen]
    AdminTimetableContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
      required: [classes, sections, subjects]
    AdminCalendarContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        classSections:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [classes, sections, classSections]
    AdminAttendanceContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
        attendanceTarget:
          type: number
      required: [classes, sections, subjects, attendanceTarget]
    AdminExamControllerContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        exam_types:
          type: array
          items:
            type: string
      required: [classes, sections, exam_types]
    AdminNoticeboardContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
      required: [classes, sections]
    MobileTeacherFirstLoginPasswordChange:
      type: object
      additionalProperties: false
      properties:
        challengeToken:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
        confirmPassword:
          type: string
          minLength: 6
      required: [challengeToken, currentPassword, newPassword, confirmPassword]
    MobileTeacherFirstLoginPasswordChanged:
      type: object
      properties:
        state:
          type: string
          const: password_changed
      required: [state]

