openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/timetable/context:
    get:
      operationId: getAdminTimetableContext
      tags: [admin-timetable]
      summary: Get school metadata required by the Timetable Master
      responses:
        "200":
          description: Timetable setup values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTimetableContext"
        "403":
          description: Admin access or the Support Staff Timetable Master grant is required
  /admin/calendar/context:
    get:
      operationId: getAdminCalendarContext
      tags: [admin-calendar]
      summary: Get school metadata required by the School Calendar
      responses:
        "200":
          description: Calendar targeting values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCalendarContext"
        "403":
          description: Admin access or the Support Staff School Calendar grant is required
  /admin/attendance/context:
    get:
      operationId: getAdminAttendanceContext
      tags: [admin-attendance]
      summary: Get school and attendance policy values required by Attendance Overview
      responses:
        "200":
          description: Attendance setup values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAttendanceContext"
        "403":
          description: Admin access or the Support Staff Attendance Overview grant is required
  /admin/exam-controller/context:
    get:
      operationId: getAdminExamControllerContext
      tags: [admin-exam-controller]
      summary: Get school metadata required by the Exam Controller
      responses:
        "200":
          description: Exam Controller setup values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExamControllerContext"
        "403":
          description: Admin access or the Support Staff Exam Controller grant is required
  /admin/noticeboard/context:
    get:
      operationId: getAdminNoticeboardContext
      tags: [admin-noticeboard]
      summary: Get school metadata required by the Noticeboard
      responses:
        "200":
          description: Noticeboard targeting values for the authenticated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNoticeboardContext"
        "403":
          description: Admin access or the Support Staff Noticeboard grant is required
  /mobile/auth/teacher/change-password:
    post:
      operationId: mobileTeacherFirstLoginChangePassword
      tags: [mobile-auth]
      summary: Complete a teacher's required first-login password change
      description: Uses a short-lived single-purpose challenge and returns no authenticated session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTeacherFirstLoginPasswordChange"
      responses:
        "200":
          description: Password changed; the teacher must sign in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTeacherFirstLoginPasswordChanged"
        "400":
          description: Invalid request or password confirmation.
        "401":
          description: Challenge expired or invalid.
        "429":
          description: Too many attempts.
        "503":
          description: Password change temporarily unavailable.
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminTimetableContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
      required: [classes, sections, subjects]
    AdminCalendarContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        classSections:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [classes, sections, classSections]
    AdminAttendanceContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
        attendanceTarget:
          type: number
      required: [classes, sections, subjects, attendanceTarget]
    AdminExamControllerContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
        exam_types:
          type: array
          items:
            type: string
      required: [classes, sections, exam_types]
    AdminNoticeboardContext:
      type: object
      properties:
        classes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: string
      required: [classes, sections]
    MobileTeacherFirstLoginPasswordChange:
      type: object
      additionalProperties: false
      properties:
        challengeToken:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
        confirmPassword:
          type: string
          minLength: 6
      required: [challengeToken, currentPassword, newPassword, confirmPassword]
    MobileTeacherFirstLoginPasswordChanged:
      type: object
      properties:
        state:
          type: string
          const: password_changed
      required: [state]

